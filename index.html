<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>과제 및 외박/패스 신청 관리 시스템</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">

  <!-- Firebase SDK (v10 compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <style>
    * { box-sizing: border-box; font-family: 'Jua', sans-serif; }
    body { background-color: #f8f9fa; color: #000; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }

    .banner-wrapper { width: 100%; max-width: 1200px; margin-bottom: 20px; text-align: center; }
    .top-banner { width: 100%; max-width: 1200px; height: auto; border: 2px solid #000; display: block; margin: 0 auto; }
    
    .main-wrapper { display: flex; gap: 20px; width: 100%; max-width: 1200px; align-items: flex-start; }
    .left-panel { flex: 1; background: #fff; padding: 20px; border: 2px solid #000; }
    .right-panel { width: 280px; min-width: 250px; background: #fff; padding: 15px; border: 2px solid #000; display: flex; flex-direction: column; gap: 10px; }
    .right-panel h3 { margin: 0; font-size: 18px; border-bottom: 2px solid #000; padding-bottom: 8px; }

    #memoText { width: 100%; height: 480px; padding: 10px; border: 1px solid #000; resize: vertical; font-size: 14px; line-height: 1.5; background-color: #fafafa; }
    #memoText:read-only { background-color: #f0f0f0; cursor: not-allowed; }

    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
    .legend-container { display: flex; flex-direction: column; gap: 6px; }
    .legend { display: flex; align-items: center; gap: 6px; font-size: 14px; flex-wrap: wrap; }
    .legend-item { padding: 2px 6px; border-radius: 3px; font-weight: normal; }
    
    .cat-A { background-color: #ffe0b2; color: #e65100; }
    .cat-B { background-color: #cce5ff; color: #004085; }
    .cat-C { background-color: #d4edda; color: #155724; }
    .cat-ALL { background-color: #fff3cd; color: #856404; }
    .cat-IMP { background-color: #ffcdd2; color: #c62828; }
    .cat-EVT { background-color: #f8bbd0; color: #c2185b; }
    .cat-OUT { background-color: #e0e0e0; color: #424242; }

    .action-btns { display: flex; gap: 8px; }
    .apply-btn { padding: 6px 14px; border: 2px solid #000; background: #ffeb3b; font-weight: bold; cursor: pointer; border-radius: 4px; }
    .admin-toggle-btn { padding: 6px 14px; border: 2px solid #000; background: #fff; cursor: pointer; border-radius: 4px; }
    .admin-toggle-btn.active { background: #000; color: #fff; }

    .month-header { display: flex; justify-content: center; align-items: center; gap: 20px; margin-bottom: 15px; }
    .month-title { font-size: 30px; color: #2b66d9; }
    .nav-btn { background: none; border: 1px solid #000; padding: 4px 10px; cursor: pointer; font-size: 14px; }

    table.calendar { width: 100%; border-collapse: collapse; border: 2px solid #000; table-layout: fixed; }
    table.calendar th { border: 1px solid #000; padding: 8px 4px; text-align: center; font-size: 14px; background-color: #fff; }
    table.calendar th.sat, table.calendar th.sun { background-color: #cbe0ff; color: #2b66d9; }
    table.calendar td { border: 1px solid #000; height: 105px; vertical-align: top; padding: 4px; position: relative; background: #fff; overflow: hidden; }

    .date-num { font-size: 15px; margin-bottom: 4px; display: inline-block; }
    .date-num.sun-date, .date-num.sat-date { color: #2b66d9; }

    .assignment-list { display: flex; flex-direction: column; gap: 3px; max-height: 75px; overflow-y: auto; overflow-x: hidden; padding-top: 2px; }
    
    .assignment-item { 
      font-size: 11px; padding: 2px 4px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; 
      border: 1px solid rgba(0,0,0,0.12); display: flex; align-items: center; justify-content: space-between; height: 20px; box-sizing: border-box;
    }
    
    .assignment-item.bar-start { border-top-left-radius: 4px; border-bottom-left-radius: 4px; }
    .assignment-item.bar-not-start { border-top-left-radius: 0; border-bottom-left-radius: 0; margin-left: -5px; border-left: none; }
    .assignment-item.bar-end { border-top-right-radius: 4px; border-bottom-right-radius: 4px; }
    .assignment-item.bar-not-end { border-top-right-radius: 0; border-bottom-right-radius: 0; margin-right: -5px; border-right: none; }

    .add-btn { display: none; position: absolute; right: 4px; top: 4px; width: 18px; height: 18px; border: 1px solid #000; background: #fff; border-radius: 50%; font-size: 12px; line-height: 16px; text-align: center; cursor: pointer; z-index: 2; }
    body.admin-mode .add-btn { display: block; }

    /* 선생님 전용 승인 관리 화면 영역 */
    .teacher-panel { width: 100%; max-width: 1200px; margin-top: 25px; background: #fff; border: 2px solid #000; padding: 20px; display: none; }
    body.admin-mode .teacher-panel { display: block; }

    .teacher-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
    .teacher-header h2 { margin: 0; font-size: 20px; }
    .week-filter { display: flex; align-items: center; gap: 10px; }

    .request-sections { display: flex; flex-direction: column; gap: 20px; }
    .section-title { font-size: 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }

    .request-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
    .req-card { border: 1px solid #000; padding: 12px; background: #fff; border-radius: 4px; display: flex; flex-direction: column; gap: 6px; box-shadow: 2px 2px 0px #000; }
    .req-card-header { font-weight: bold; font-size: 15px; border-bottom: 1px solid #ddd; padding-bottom: 4px; display: flex; justify-content: space-between; }
    .req-info { font-size: 13px; color: #333; line-height: 1.4; }
    .req-btns { display: flex; gap: 5px; margin-top: 6px; justify-content: flex-end; }
    .req-btns button { font-size: 12px; padding: 3px 8px; border: 1px solid #000; background: #fff; cursor: pointer; border-radius: 2px; }

    table.data-table { width: 100%; border-collapse: collapse; border: 1px solid #000; margin-top: 8px; font-size: 13px; }
    table.data-table th, table.data-table td { border: 1px solid #000; padding: 8px; text-align: left; }
    table.data-table th { background: #eee; }

    .modal-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 100; }
    .modal { background: #fff; border: 2px solid #000; width: 380px; max-height: 90vh; overflow-y: auto; padding: 20px; box-shadow: 4px 4px 0px #000; }
    .modal h3 { margin-top: 0; font-size: 18px; border-bottom: 2px solid #000; padding-bottom: 8px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 13px; margin-bottom: 4px; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 6px; border: 1px solid #000; border-radius: 2px; font-size: 14px; }
    .modal-btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 15px; }
    .btn { padding: 5px 12px; border: 1px solid #000; background: #fff; cursor: pointer; font-size: 14px; }
    .btn-primary { background: #000; color: #fff; }
    .btn-success { background: #4caf50; color: #fff; }
    .btn-danger { background: #ff4d4d; color: #fff; }

    .img-preview { max-width: 100%; max-height: 150px; margin-top: 5px; border: 1px solid #ccc; display: none; }
    .detail-img { max-width: 100%; margin-top: 8px; border: 1px solid #000; }
    .status-bar { font-size: 12px; color: #666; text-align: right; margin-bottom: 5px; }

    @media (max-width: 850px) {
      .main-wrapper { flex-direction: column; }
      .right-panel { width: 100%; }
      #memoText { height: 150px; }
    }
  </style>
</head>
<body>

  <div class="banner-wrapper">
    <img src="banner.jpg" alt="시간표 배너" class="top-banner" onerror="this.style.display='none'">
  </div>

  <div class="main-wrapper">
    <div class="left-panel">
      <div class="top-bar">
        <div class="legend-container">
          <div class="legend">
            <span class="legend-item cat-A">A반</span> / 
            <span class="legend-item cat-B">B반</span> / 
            <span class="legend-item cat-C">C반</span> / 
            <span class="legend-item cat-ALL">전체</span> / 
            <span class="legend-item cat-IMP">중요</span> / 
            <span class="legend-item cat-EVT">행사</span> / 
            <span class="legend-item cat-OUT">외박</span>
          </div>
        </div>
        <div class="action-btns">
          <button class="apply-btn" onclick="openModal('studentApplyModal')">✏️ 외박/패스 신청하기</button>
          <button class="admin-toggle-btn" id="adminBtn" onclick="toggleAdmin()">선생님 접속 (학생 모드)</button>
        </div>
      </div>

      <div class="status-bar" id="syncStatus">🔄 Firebase 연결 중...</div>

      <div class="month-header">
        <button class="nav-btn" onclick="changeMonth(-1)">&lt; 이전</button>
        <div class="month-title" id="monthTitle">월</div>
        <button class="nav-btn" onclick="changeMonth(1)">다음 &gt;</button>
      </div>

      <table class="calendar">
        <thead>
          <tr>
            <th class="sun">SUN</th>
            <th>MON</th>
            <th>TUE</th>
            <th>WED</th>
            <th>THU</th>
            <th>FRI</th>
            <th class="sat">SAT</th>
          </tr>
        </thead>
        <tbody id="calendarBody"></tbody>
      </table>
    </div>

    <div class="right-panel">
      <h3>메모 / 공지</h3>
      <textarea id="memoText" placeholder="선생님 접속 후 공지사항을 입력할 수 있습니다..." readonly oninput="saveMemo()"></textarea>
    </div>
  </div>

  <!-- 선생님 전용 주차별 승인/거절 및 대시보드 관리 판 -->
  <div class="teacher-panel">
    <div class="teacher-header">
      <h2>📋 선생님 신청 승인 관리 시스템</h2>
      <div class="week-filter">
        <label style="font-size: 14px;"><strong>주차 선택 (토요일 기준):</strong></label>
        <select id="weekSelect" onchange="renderRequests()"></select>
      </div>
    </div>

    <div class="request-sections">
      <!-- 미승인 신청 목록 -->
      <div>
        <div class="section-title">
          <span style="color: #d32f2f;"><strong>⏳ 승인 대기 목록 (미승인)</strong></span>
          <button class="btn btn-success" onclick="approveAllPending()">⚡ 선택 주차 전체 승인</button>
        </div>
        <div class="request-cards" id="pendingContainer">
          <div style="font-size: 13px; color: #666;">대기 중인 신청 건이 없습니다.</div>
        </div>
      </div>

      <!-- 승인 완료 목록 (한번에 보는 표) -->
      <div style="margin-top: 15px;">
        <div class="section-title">
          <span style="color: #2e7d32;"><strong>✅ 승인 완료 목록 (한눈에 보기)</strong></span>
        </div>
        <table class="data-table">
          <thead>
            <tr>
              <th style="width: 15%;">이름</th>
              <th style="width: 25%;">시간 / 기간</th>
              <th style="width: 20%;">패스 받을 기기</th>
              <th style="width: 30%;">사유</th>
              <th style="width: 10%;">관리</th>
            </tr>
          </thead>
          <tbody id="approvedTableBody">
            <tr><td colspan="5" style="text-align:center; color:#666;">승인된 신청 내역이 없습니다.</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 학생 외박/패스 신청 모달 -->
  <div class="modal-overlay" id="studentApplyModal">
    <div class="modal">
      <h3>외박 및 기기 패스 신청</h3>
      <div class="form-group">
        <label>학생 이름</label>
        <input type="text" id="reqStudentName" placeholder="예: 김철수">
      </div>
      <div class="form-group">
        <label>신청 기준 주 (토요일)</label>
        <input type="date" id="reqSatDate">
      </div>
      <div class="form-group">
        <label>시간 / 기간</label>
        <input type="text" id="reqTime" placeholder="예: 9/20(토) 14:00 ~ 9/21(일) 18:00">
      </div>
      <div class="form-group">
        <label>패스 받을 기기</label>
        <input type="text" id="reqDevice" placeholder="예: 아이패드 9세대 / 스마트폰">
      </div>
      <div class="form-group">
        <label>사유</label>
        <textarea id="reqReason" rows="3" placeholder="신청 사유를 구체적으로 작성해 주세요."></textarea>
      </div>
      <div class="modal-btns">
        <button class="btn" onclick="closeModal('studentApplyModal')">취소</button>
        <button class="btn btn-primary" onclick="submitStudentRequest()">신청서 제출</button>
      </div>
    </div>
  </div>

  <!-- 비밀번호 모달 -->
  <div class="modal-overlay" id="passwordModal">
    <div class="modal" style="width: 280px;">
      <h3>선생님 로그인</h3>
      <div class="form-group">
        <label>비밀번호</label>
        <input type="password" id="adminPasswordInput" placeholder="비밀번호 입력" onkeydown="if(event.key==='Enter') checkPassword()">
      </div>
      <div class="modal-btns">
        <button class="btn" onclick="closeModal('passwordModal')">취소</button>
        <button class="btn btn-primary" onclick="checkPassword()">확인</button>
      </div>
    </div>
  </div>

  <!-- 일정 추가 모달 -->
  <div class="modal-overlay" id="formModal">
    <div class="modal">
      <h3 id="formTitle">일정 추가</h3>
      <input type="hidden" id="assignmentId">
      <div class="form-group">
        <label>과제 / 일정명</label>
        <input type="text" id="inputTitle" placeholder="예: 수학 학습지 제출 / 수련회">
      </div>
      <div class="form-group" style="display: flex; gap: 10px;">
        <div style="flex: 1;">
          <label>시작일</label>
          <input type="date" id="inputStartDate">
        </div>
        <div style="flex: 1;">
          <label>종료일</label>
          <input type="date" id="inputEndDate">
        </div>
      </div>
      <div class="form-group">
        <label>분류</label>
        <select id="inputCategory">
          <option value="A">A반 (주황)</option>
          <option value="B">B반 (연한 파랑)</option>
          <option value="C">C반 (연한 초록)</option>
          <option value="ALL">전체 (연한 노랑)</option>
          <option value="IMP">중요 (빨강)</option>
          <option value="EVT">행사 (핑크)</option>
          <option value="OUT">외박 (회색)</option>
        </select>
      </div>
      <div class="form-group">
        <label>제출기한 / 시간</label>
        <input type="text" id="inputDeadline" placeholder="예: 23:59까지 / 점심시간 전">
      </div>
      <div class="form-group">
        <label>사진 첨부</label>
        <input type="file" id="inputImage" accept="image/*" onchange="handleImageSelect(event)">
        <img id="imagePreview" class="img-preview" alt="사진 미리보기">
        <button type="button" id="removeImgBtn" class="btn" style="display:none; margin-top:5px; font-size:12px;" onclick="removeSelectedImage()">사진 삭제</button>
      </div>
      <div class="form-group">
        <label>기타/특이사항</label>
        <textarea id="inputNotes" rows="3" placeholder="참고사항을 입력하세요."></textarea>
      </div>
      <div class="modal-btns">
        <button class="btn" onclick="closeModal('formModal')">취소</button>
        <button class="btn btn-primary" onclick="saveAssignment()">저장</button>
      </div>
    </div>
  </div>

  <!-- 일정 상세정보 모달 -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal">
      <h3 id="detailTitle">일정 상세정보</h3>
      <div class="form-group">
        <label>분류</label>
        <span id="detailCategory" class="legend-item"></span>
      </div>
      <div class="form-group">
        <label>기간</label>
        <div id="detailPeriod" style="font-size: 14px; font-weight: bold;"></div>
      </div>
      <div class="form-group">
        <label>제출기한 / 시간</label>
        <div id="detailDeadline" style="font-size: 14px;"></div>
      </div>
      <div class="form-group" id="detailImageGroup" style="display:none;">
        <label>첨부 사진</label>
        <img id="detailImage" class="detail-img" src="" alt="첨부 사진">
      </div>
      <div class="form-group">
        <label>기타/특이사항</label>
        <div id="detailNotes" style="font-size: 14px; white-space: pre-wrap; background: #f0f0f0; padding: 6px; border: 1px solid #ccc;"></div>
      </div>
      <div class="modal-btns">
        <button class="btn btn-danger" id="deleteBtn" style="display:none;" onclick="deleteAssignment()">삭제</button>
        <button class="btn btn-primary" id="editBtn" style="display:none;" onclick="openEditForm()">수정</button>
        <button class="btn" onclick="closeModal('detailModal')">닫기</button>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA_GtfqjXYNgChzjBd8K63fArXFpyWZbr0",
      authDomain: "grad-timetable.firebaseapp.com",
      databaseURL: "https://grad-timetable-default-rtdb.firebaseio.com",
      projectId: "grad-timetable",
      storageBucket: "grad-timetable.firebasestorage.app",
      messagingSenderId: "70837618674",
      appId: "1:70837618674:web:f7183136c2b9499451cd6b",
      measurementId: "G-F7SJ17KSBH"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const today = new Date();
    let currentYear = today.getFullYear();
    let currentMonth = today.getMonth();
    let isAdmin = false;
    let activeAssignmentId = null;
    let currentBase64Image = "";
    let memoSaveTimer = null;

    let assignments = [];
    let memoData = "";
    let requests = [];

    const categories = {
      'A': { name: 'A반', class: 'cat-A' },
      'B': { name: 'B반', class: 'cat-B' },
      'C': { name: 'C반', class: 'cat-C' },
      'ALL': { name: '전체', class: 'cat-ALL' },
      'IMP': { name: '중요', class: 'cat-IMP' },
      'EVT': { name: '행사', class: 'cat-EVT' },
      'OUT': { name: '외박', class: 'cat-OUT' }
    };

    function initFirebaseSync() {
      const statusElem = document.getElementById('syncStatus');

      // 일정 동기화
      db.ref('assignments').on('value', (snapshot) => {
        const data = snapshot.val();
        assignments = data ? Object.values(data) : [];
        renderCalendar();
        statusElem.innerText = '⚡ Firebase 실시간 동기화 완료';
      }, (error) => {
        statusElem.innerText = '⚠️ Firebase 보안규칙을 확인해주세요.';
      });

      // 메모 동기화
      db.ref('memo').on('value', (snapshot) => {
        memoData = snapshot.val() || "";
        const memoElem = document.getElementById('memoText');
        if (document.activeElement !== memoElem) {
          memoElem.value = memoData;
        }
      });

      // 학생 신청 내역 실시간 동기화
      db.ref('requests').on('value', (snapshot) => {
        const data = snapshot.val();
        requests = data ? Object.values(data) : [];
        updateWeekSelectOptions();
        renderRequests();
      });
    }

    // 다음 토요일 날짜 구하기 Helper
    function getUpcomingSaturdayStr(dateObj = new Date()) {
      const d = new Date(dateObj);
      const day = d.getDay();
      const diff = d.getDate() + (6 - day);
      const sat = new Date(d.setDate(diff));
      return sat.toISOString().split('T')[0];
    }

    // 학생 신청서 제출
    function submitStudentRequest() {
      const name = document.getElementById('reqStudentName').value.trim();
      const satDate = document.getElementById('reqSatDate').value;
      const time = document.getElementById('reqTime').value.trim();
      const device = document.getElementById('reqDevice').value.trim();
      const reason = document.getElementById('reqReason').value.trim();

      if (!name || !satDate || !time || !device) {
        alert('이름, 주차 토요일 날짜, 시간, 기기를 모두 입력해 주세요.');
        return;
      }

      const reqId = 'req_' + Date.now();
      const requestData = {
        id: reqId,
        name,
        satDate, // 토요일 기준 주차 키
        time,
        device,
        reason,
        status: 'pending', // pending, approved, rejected
        timestamp: Date.now()
      };

      db.ref('requests/' + reqId).set(requestData);
      alert('신청이 성공적으로 제출되었습니다!');
      closeModal('studentApplyModal');

      // 입력창 초기화
      document.getElementById('reqStudentName').value = '';
      document.getElementById('reqTime').value = '';
      document.getElementById('reqDevice').value = '';
      document.getElementById('reqReason').value = '';
    }

    // 선생님 관리 화면 주차 선택 드롭다운 업데이트
    function updateWeekSelectOptions() {
      const select = document.getElementById('weekSelect');
      const currentSelected = select.value;

      // 주차(토요일) 수집
      const weekSet = new Set();
      const thisSat = getUpcomingSaturdayStr();
      weekSet.add(thisSat);

      requests.forEach(r => { if(r.satDate) weekSet.add(r.satDate); });
      const sortedWeeks = Array.from(weekSet).sort().reverse();

      select.innerHTML = '';
      sortedWeeks.forEach(w => {
        const opt = document.createElement('option');
        opt.value = w;
        opt.innerText = `${w} 주차 (토요일 기준)`;
        select.appendChild(opt);
      });

      if (currentSelected && sortedWeeks.includes(currentSelected)) {
        select.value = currentSelected;
      } else {
        select.value = thisSat;
      }
    }

    // 주차별 선생님 승인/거절 및 표 렌더링
    function renderRequests() {
      if (!isAdmin) return;
      const selectedWeek = document.getElementById('weekSelect').value;
      
      const filtered = requests.filter(r => r.satDate === selectedWeek);
      const pendingList = filtered.filter(r => r.status === 'pending');
      const approvedList = filtered.filter(r => r.status === 'approved');

      // 1. 미승인 대기 카드목록 렌더링
      const pendingContainer = document.getElementById('pendingContainer');
      pendingContainer.innerHTML = '';

      if (pendingList.length === 0) {
        pendingContainer.innerHTML = '<div style="font-size: 13px; color: #666;">대기 중인 신청 건이 없습니다.</div>';
      } else {
        pendingList.forEach(req => {
          const card = document.createElement('div');
          card.className = 'req-card';
          card.innerHTML = `
            <div class="req-card-header">
              <span>${req.name}</span>
              <span style="color: #e65100; font-size:12px;">대기중</span>
            </div>
            <div class="req-info">
              <div><strong>시간:</strong> ${req.time}</div>
              <div><strong>기기:</strong> ${req.device}</div>
              <div><strong>사유:</strong> ${req.reason || '없음'}</div>
            </div>
            <div class="req-btns">
              <button onclick="copyReqInfo('${req.id}')">📋 복사</button>
              <button style="background:#4caf50; color:#fff;" onclick="changeReqStatus('${req.id}', 'approved')">승인</button>
              <button style="background:#ff4d4d; color:#fff;" onclick="changeReqStatus('${req.id}', 'rejected')">거절</button>
            </div>
          `;
          pendingContainer.appendChild(card);
        });
      }

      // 2. 승인 완료 목록 (한눈에 보는 표) 렌더링
      const approvedTbody = document.getElementById('approvedTableBody');
      approvedTbody.innerHTML = '';

      if (approvedList.length === 0) {
        approvedTbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#666;">승인된 신청 내역이 없습니다.</td></tr>';
      } else {
        approvedList.forEach(req => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><strong>${req.name}</strong></td>
            <td>${req.time}</td>
            <td>${req.device}</td>
            <td>${req.reason || '-'}</td>
            <td>
              <button style="font-size:11px; padding:2px 5px;" onclick="copyReqInfo('${req.id}')">복사</button>
              <button style="font-size:11px; padding:2px 5px; background:#ff9800; color:#fff; border:none;" onclick="changeReqStatus('${req.id}', 'pending')">취소</button>
            </td>
          `;
          approvedTbody.appendChild(tr);
        });
      }
    }

    // 시간, 패스 받을 기기, 사유만 복사하는 기능
    function copyReqInfo(id) {
      const req = requests.find(r => r.id === id);
      if (!req) return;

      const copyText = `시간: ${req.time}\n기기: ${req.device}\n사유: ${req.reason || '없음'}`;
      navigator.clipboard.writeText(copyText).then(() => {
        alert(`${req.name} 학생의 신청 정보가 클립보드에 복사되었습니다!\n\n${copyText}`);
      }).catch(err => {
        alert('복사에 실패했습니다.');
      });
    }

    // 승인 / 거절 상태 변경
    function changeReqStatus(id, newStatus) {
      db.ref('requests/' + id + '/status').set(newStatus);
    }

    // 선택 주차 전체 승인 버튼
    function approveAllPending() {
      const selectedWeek = document.getElementById('weekSelect').value;
      const pendingList = requests.filter(r => r.satDate === selectedWeek && r.status === 'pending');

      if (pendingList.length === 0) {
        alert('승인할 대기 항목이 없습니다.');
        return;
      }

      if (confirm(`선택한 주차의 미승인 신청 ${pendingList.length}건을 일괄 승인하시겠습니까?`)) {
        pendingList.forEach(r => {
          db.ref('requests/' + r.id + '/status').set('approved');
        });
      }
    }

    function saveMemo() {
      if (!isAdmin) return;
      memoData = document.getElementById('memoText').value;
      clearTimeout(memoSaveTimer);
      memoSaveTimer = setTimeout(() => {
        db.ref('memo').set(memoData);
      }, 500);
    }

    function toggleAdmin() {
      if (!isAdmin) {
        document.getElementById('adminPasswordInput').value = '';
        openModal('passwordModal');
        document.getElementById('adminPasswordInput').focus();
      } else {
        isAdmin = false;
        updateAdminStateUI();
      }
    }

    function checkPassword() {
      if (document.getElementById('adminPasswordInput').value === "inhaklove") {
        isAdmin = true;
        closeModal('passwordModal');
        updateAdminStateUI();
        alert("선생님 권한이 활성화되었습니다.");
      } else {
        alert("비밀번호가 올바르지 않습니다.");
      }
    }

    function updateAdminStateUI() {
      const memoTextarea = document.getElementById('memoText');
      const adminBtn = document.getElementById('adminBtn');

      if (isAdmin) {
        document.body.classList.add('admin-mode');
        adminBtn.innerText = "선생님 모드 (접속중)";
        adminBtn.classList.add('active');
        memoTextarea.readOnly = false;
        memoTextarea.placeholder = "공지사항이나 전달 내용을 입력하세요...";
        renderRequests();
      } else {
        document.body.classList.remove('admin-mode');
        adminBtn.innerText = "선생님 접속 (학생 모드)";
        adminBtn.classList.remove('active');
        memoTextarea.readOnly = true;
        memoTextarea.placeholder = "선생님 접속 후 공지사항을 입력할 수 있습니다...";
      }
      renderCalendar();
    }

    function changeMonth(delta) {
      currentMonth += delta;
      if (currentMonth < 0) { currentMonth = 11; currentYear--; }
      else if (currentMonth > 11) { currentMonth = 0; currentYear++; }
      renderCalendar();
    }

    function renderCalendar() {
      document.getElementById('monthTitle').innerText = `${currentYear}년 ${currentMonth + 1}월`;

      const firstDay = new Date(currentYear, currentMonth, 1).getDay();
      const lastDate = new Date(currentYear, currentMonth + 1, 0).getDate();

      const tbody = document.getElementById('calendarBody');
      tbody.innerHTML = '';

      let row = document.createElement('tr');

      for (let i = 0; i < firstDay; i++) {
        row.appendChild(document.createElement('td'));
      }

      for (let day = 1; day <= lastDate; day++) {
        let currentDayOfWeek = (firstDay + day - 1) % 7;
        let dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;

        let cell = document.createElement('td');

        let numSpan = document.createElement('span');
        numSpan.className = 'date-num';
        if (currentDayOfWeek === 0) numSpan.classList.add('sun-date');
        if (currentDayOfWeek === 6) numSpan.classList.add('sat-date');
        numSpan.innerText = day;
        cell.appendChild(numSpan);

        let addBtn = document.createElement('button');
        addBtn.className = 'add-btn';
        addBtn.innerText = '+';
        addBtn.onclick = (e) => { e.stopPropagation(); openAddModal(dateStr); };
        cell.appendChild(addBtn);

        let listContainer = document.createElement('div');
        listContainer.className = 'assignment-list';

        let dayAssignments = assignments.filter(a => {
          const s = a.startDate || a.date;
          const e = a.endDate || s;
          return s <= dateStr && dateStr <= e;
        });

        dayAssignments.sort((a, b) => {
          const sA = a.startDate || a.date;
          const sB = b.startDate || b.date;
          if (sA !== sB) return sA.localeCompare(sB);
          const eA = a.endDate || sA;
          const eB = b.endDate || sB;
          if (eA !== eB) return eB.localeCompare(eA);
          return a.id.localeCompare(b.id);
        });

        dayAssignments.forEach(item => {
          const sDate = item.startDate || item.date;
          const eDate = item.endDate || sDate;

          const isStart = (dateStr === sDate);
          const isEnd = (dateStr === eDate);

          let itemDiv = document.createElement('div');
          const catInfo = categories[item.category] || categories['ALL'];
          itemDiv.className = `assignment-item ${catInfo.class}`;

          if (isStart) itemDiv.classList.add('bar-start');
          else itemDiv.classList.add('bar-not-start');

          if (isEnd) itemDiv.classList.add('bar-end');
          else itemDiv.classList.add('bar-not-end');

          const showTitle = isStart || currentDayOfWeek === 0;
          const titleText = showTitle ? item.title : '&nbsp;';
          const photoIcon = (isEnd && item.image) ? '<span style="font-size:10px;">📷</span>' : '';

          itemDiv.innerHTML = `<span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${titleText}</span>${photoIcon}`;
          itemDiv.onclick = () => openDetailModal(item.id);
          listContainer.appendChild(itemDiv);
        });

        cell.appendChild(listContainer);
        row.appendChild(cell);

        if (currentDayOfWeek === 6) {
          tbody.appendChild(row);
          row = document.createElement('tr');
        }
      }

      let remainingCells = (7 - ((firstDay + lastDate) % 7)) % 7;
      for (let i = 0; i < remainingCells; i++) {
        row.appendChild(document.createElement('td'));
      }

      if (row.children.length > 0) {
        tbody.appendChild(row);
      }
    }

    function openModal(id) { 
      if(id === 'studentApplyModal') {
        document.getElementById('reqSatDate').value = getUpcomingSaturdayStr();
      }
      document.getElementById(id).style.display = 'flex'; 
    }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    function handleImageSelect(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          currentBase64Image = evt.target.result;
          const preview = document.getElementById('imagePreview');
          preview.src = currentBase64Image;
          preview.style.display = 'block';
          document.getElementById('removeImgBtn').style.display = 'inline-block';
        };
        reader.readAsDataURL(file);
      }
    }

    function removeSelectedImage() {
      currentBase64Image = "";
      document.getElementById('inputImage').value = "";
      document.getElementById('imagePreview').style.display = "none";
      document.getElementById('imagePreview').src = "";
      document.getElementById('removeImgBtn').style.display = "none";
    }

    function openAddModal(dateStr) {
      document.getElementById('formTitle').innerText = '일정 추가';
      document.getElementById('assignmentId').value = '';
      document.getElementById('inputStartDate').value = dateStr;
      document.getElementById('inputEndDate').value = dateStr;
      document.getElementById('inputTitle').value = '';
      document.getElementById('inputCategory').value = 'A';
      document.getElementById('inputDeadline').value = '';
      document.getElementById('inputNotes').value = '';
      removeSelectedImage();
      openModal('formModal');
    }

    function saveAssignment() {
      let id = document.getElementById('assignmentId').value;
      let startDate = document.getElementById('inputStartDate').value;
      let endDate = document.getElementById('inputEndDate').value;
      let title = document.getElementById('inputTitle').value.trim();
      let category = document.getElementById('inputCategory').value;
      let deadline = document.getElementById('inputDeadline').value.trim();
      let notes = document.getElementById('inputNotes').value.trim();

      if (!title || !startDate || !endDate) {
        alert('필수 정보를 입력해주세요.');
        return;
      }

      const targetId = id || 'item_' + Date.now();
      const assignmentData = {
        id: targetId, startDate, endDate, title, category, deadline, notes, image: currentBase64Image
      };

      db.ref('assignments/' + targetId).set(assignmentData);
      closeModal('formModal');
    }

    function openDetailModal(id) {
      activeAssignmentId = id;
      let item = assignments.find(a => a.id === id);
      if (!item) return;

      const catInfo = categories[item.category] || categories['ALL'];
      const sDate = item.startDate || item.date;
      const eDate = item.endDate || sDate;
      const periodStr = (sDate === eDate) ? sDate : `${sDate} ~ ${eDate}`;

      document.getElementById('detailTitle').innerText = item.title;
      document.getElementById('detailCategory').innerText = catInfo.name;
      document.getElementById('detailCategory').className = `legend-item ${catInfo.class}`;
      document.getElementById('detailPeriod').innerText = periodStr;
      document.getElementById('detailDeadline').innerText = item.deadline || '기한 없음';
      document.getElementById('detailNotes').innerText = item.notes || '내용 없음';

      const imgGroup = document.getElementById('detailImageGroup');
      const imgElem = document.getElementById('detailImage');
      if (item.image) {
        imgElem.src = item.image;
        imgGroup.style.display = 'block';
      } else {
        imgGroup.style.display = 'none';
        imgElem.src = '';
      }

      document.getElementById('editBtn').style.display = isAdmin ? 'inline-block' : 'none';
      document.getElementById('deleteBtn').style.display = isAdmin ? 'inline-block' : 'none';

      openModal('detailModal');
    }

    function openEditForm() {
      closeModal('detailModal');
      let item = assignments.find(a => a.id === activeAssignmentId);
      if (!item) return;

      document.getElementById('formTitle').innerText = '일정 수정';
      document.getElementById('assignmentId').value = item.id;
      document.getElementById('inputStartDate').value = item.startDate || item.date;
      document.getElementById('inputEndDate').value = item.endDate || item.startDate || item.date;
      document.getElementById('inputTitle').value = item.title;
      document.getElementById('inputCategory').value = item.category;
      document.getElementById('inputDeadline').value = item.deadline || '';
      document.getElementById('inputNotes').value = item.notes || '';

      currentBase64Image = item.image || "";
      if (currentBase64Image) {
        const preview = document.getElementById('imagePreview');
        preview.src = currentBase64Image;
        preview.style.display = 'block';
        document.getElementById('removeImgBtn').style.display = 'inline-block';
      } else {
        removeSelectedImage();
      }

      openModal('formModal');
    }

    function deleteAssignment() {
      if (confirm('정말 이 일정을 삭제하시겠습니까?')) {
        db.ref('assignments/' + activeAssignmentId).remove();
        closeModal('detailModal');
      }
    }

    renderCalendar();
    initFirebaseSync();
  </script>
</body>
</html>
