<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>도서관 패스 키오스크</title>
  
  <!-- 8비트 아케이드 픽셀 폰트 로드 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/neodunggeunmo/neodunggeunmo@v1.5.0/neodunggeunmo.css">
  
  <!-- Firebase 라이브러리 (Auth, Database) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    @font-face {
      font-family: 'PFStardust';
      src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonnu-2010-2@1.0/PFStardust.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      font-family: 'PFStardust', 'NeoDunggeunmo', monospace;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 20px 0;
      background-color: #000;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .kiosk-outer-frame {
      background: #fff;
      padding: 3px;
      box-shadow: 
        4px 4px 0px #000, 
        6px 6px 0px #fff, 
        10px 10px 0px #000, 
        12px 12px 0px #fff;
      margin-bottom: 12px;
    }

    .kiosk-container {
      width: 90vw;
      max-width: 500px;
      background: #0a0a0a;
      border: 3px solid #fff;
      padding: 16px;
      position: relative;
    }

    .scanlines {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%);
      background-size: 100% 3px;
      pointer-events: none;
      z-index: 20;
    }

    .frame-header {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      letter-spacing: 2px;
      margin-bottom: 10px;
      padding: 0 2px;
    }
    .frame-header-title::before { content: "■ "; }

    .screen-border {
      border: 2px solid #fff;
      padding: 24px 16px;
      min-height: 440px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #050505;
      position: relative;
    }

    .screen {
      display: none;
      width: 100%;
    }
    .screen.active {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .arcade-text {
      display: inline-block;
      animation: arcadeFloat 1.2s infinite ease-in-out;
    }

    @keyframes arcadeFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    .main-title {
      font-size: 34px;
      letter-spacing: 5px;
      margin-bottom: 12px;
      text-align: center;
    }
    .main-sub {
      font-size: 12px;
      letter-spacing: 4px;
      color: #888;
      margin-bottom: 40px;
      text-align: center;
    }

    .pixel-btn {
      background: #fff;
      color: #000;
      border: 2px solid #fff;
      padding: 10px 32px;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 4px 4px 0px #888, 6px 6px 0px #000;
    }
    .pixel-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px #888, 4px 4px 0px #000;
    }

    .user-info-bar {
      font-size: 11px;
      color: #aaa;
      margin-bottom: 15px;
      border-bottom: 1px dashed #444;
      padding-bottom: 6px;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .form-title {
      font-size: 22px;
      letter-spacing: 4px;
      margin-bottom: 20px;
      text-align: center;
    }
    .form-group {
      width: 100%;
      margin-bottom: 14px;
    }
    .form-label {
      font-size: 13px;
      color: #aaa;
      margin-bottom: 6px;
      display: block;
    }

    input[type="text"], select {
      width: 100%;
      background: #000;
      border: 2px solid #fff;
      color: #fff;
      padding: 8px 10px;
      font-size: 14px;
      outline: none;
      border-radius: 0;
    }
    ::placeholder { color: #555; }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .check-btn {
      background: #000;
      border: 2px solid #fff;
      color: #fff;
      padding: 8px 4px;
      font-size: 12px;
      text-align: center;
      cursor: pointer;
      box-shadow: 3px 3px 0px #fff;
    }
    .check-btn.selected {
      background: #fff;
      color: #000;
      box-shadow: 3px 3px 0px #888;
    }

    .btn-submit-wide {
      width: 100%;
      background: #000;
      border: 2px solid #fff;
      color: #fff;
      padding: 10px;
      font-size: 18px;
      letter-spacing: 2px;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 4px 4px 0px #fff;
    }

    .status-sub {
      font-size: 12px;
      letter-spacing: 3px;
      color: #777;
      margin-bottom: 16px;
    }
    .status-main-text {
      font-size: 28px;
      letter-spacing: 2px;
      margin-bottom: 12px;
      text-align: center;
      min-width: 200px;
    }
    .code-text {
      font-size: 14px;
      letter-spacing: 2px;
      color: #888;
      margin-bottom: 30px;
    }

    .print-slot-area {
      margin-top: 14px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .print-slot-bar {
      width: 85%;
      height: 8px;
      background: #000;
      border: 1px solid #fff;
      position: relative;
      z-index: 10;
    }

    .receipt-dispenser-wrapper {
      width: 75%;
      overflow: hidden;
      max-height: 0;
      transition: max-height 2.2s cubic-bezier(0.25, 1, 0.5, 1);
      margin-top: -4px;
      position: relative;
      z-index: 5;
    }
    .receipt-dispenser-wrapper.slide-down {
      max-height: 230px;
    }

    .paper-out {
      background: #fff;
      color: #000;
      border: 2px solid #000;
      border-top: none;
      padding: 14px 12px;
      font-size: 12px;
      cursor: pointer;
      box-shadow: 0 6px 12px rgba(255,255,255,0.15);
      min-height: 200px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-align: left;
    }

    .receipt-dispenser-wrapper.slide-down .paper-out {
      animation: paperPrint 2.2s ease-out forwards;
    }

    @keyframes paperPrint {
      0% { transform: translateY(0); }
      15% { transform: translateY(-1px); }
      30% { transform: translateY(1px); }
      45% { transform: translateY(-1px); }
      60% { transform: translateY(1px); }
      75% { transform: translateY(-0.5px); }
      100% { transform: translateY(0); }
    }

    .print-slot-label {
      font-size: 10px;
      letter-spacing: 4px;
      color: #666;
      margin-top: 6px;
    }

    .teacher-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-bottom: 12px;
    }
    .btn-clear-all {
      background: #000;
      border: 2px solid #fff;
      color: #fff;
      padding: 4px 8px;
      font-size: 12px;
      cursor: pointer;
      box-shadow: 2px 2px 0px #fff;
    }
    .btn-clear-all:active {
      background: #fff;
      color: #000;
    }

    .admin-card {
      width: 100%;
      border: 2px solid #fff;
      padding: 12px;
      margin-bottom: 12px;
      background: #000;
      color: #fff;
    }
    .admin-card-title {
      font-size: 16px;
      font-weight: bold;
      color: #fff;
      margin-bottom: 6px;
    }
    .admin-card-info {
      font-size: 13px;
      color: #fff;
      margin: 4px 0;
      line-height: 1.4;
    }
    .admin-actions {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    .btn-admin-act {
      background: #000;
      border: 1px solid #fff;
      color: #fff;
      padding: 4px 12px;
      cursor: pointer;
      font-size: 13px;
    }
    .btn-admin-act:hover {
      background: #fff;
      color: #000;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.9);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .modal-overlay.active { display: flex; }
    .receipt-paper {
      background: #fff;
      color: #000;
      width: 290px;
      padding: 20px;
      border: 3px solid #000;
      box-shadow: 6px 6px 0px #fff;
      position: relative;
    }
    .receipt-paper h3 { text-align: center; border-bottom: 2px dashed #000; padding-bottom: 8px; margin-top: 0; }
    .receipt-row { display: flex; justify-content: space-between; margin: 6px 0; font-size: 14px; }
    .stamp-box {
      position: absolute;
      bottom: 50px;
      right: 15px;
      border: 3px solid #000;
      padding: 2px 6px;
      font-weight: bold;
      transform: rotate(-12deg);
      font-size: 18px;
    }
  </style>
</head>
<body>

  <div class="kiosk-outer-frame">
    <div class="kiosk-container">
      <div class="scanlines"></div>

      <div class="frame-header">
        <span class="frame-header-title">LIBRARY PASS</span>
        <span>KO-01</span>
      </div>

      <div class="screen-border">

        <!-- [화면 1] 로그인 시작 화면 -->
        <div class="screen active" id="screenStart">
          <div class="main-title arcade-text">도서관 패스</div>
          <div class="main-sub">LIBRARY PASS</div>
          <button class="pixel-btn" onclick="loginWithGoogle()">구글 로그인</button>
        </div>

        <!-- [화면 2] 학생 패스 신청 화면 -->
        <div class="screen" id="screenForm">
          <div class="user-info-bar">
            <span id="userEmailTag">계정: -</span>
            <span style="cursor:pointer; text-decoration:underline;" onclick="logout()">로그아웃</span>
          </div>
          <div class="form-title">패스 신청</div>

          <div class="form-group">
            <label class="form-label">이름</label>
            <input type="text" id="inputName" placeholder="이름을 입력하세요">
          </div>

          <div class="form-group">
            <label class="form-label">날짜</label>
            <div class="grid-2">
              <select id="selectMonth"></select>
              <select id="selectDay"></select>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">시간 (다중선택)</label>
            <div class="grid-3" id="timeGroup">
              <div class="check-btn" onclick="toggleSelect(this)" data-val="9시~12시">[ ] 9시~12시</div>
              <div class="check-btn" onclick="toggleSelect(this)" data-val="1시~3시">[ ] 1시~3시</div>
              <div class="check-btn" onclick="toggleSelect(this)" data-val="3시~5시">[ ] 3시~5시</div>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">패스 (다중선택)</label>
            <div class="grid-3" id="passGroup">
              <div class="check-btn" onclick="toggleSelect(this)" data-val="노트북">[ ] 노트북</div>
              <div class="check-btn" onclick="toggleSelect(this)" data-val="아이패드">[ ] 아이패드</div>
              <div class="check-btn" onclick="toggleSelect(this)" data-val="이어폰">[ ] 이어폰</div>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">사유</label>
            <input type="text" id="inputReason" placeholder="사유를 입력하세요">
          </div>

          <button class="btn-submit-wide" onclick="submitPassForm()">작성하기</button>
        </div>

        <!-- [화면 3] 학생 승인 상태 화면 -->
        <div class="screen" id="screenStatus">
          <div class="status-sub">STATUS</div>
          <div class="status-main-text arcade-text" id="statusText">승인확인 중.</div>
          <div class="code-text" id="codeText">LP-0000</div>

          <button class="pixel-btn" onclick="handleReceiptPrint()" style="margin-bottom:12px;">영수증 출력</button>
          <button class="pixel-btn" onclick="logout()" style="font-size:13px; padding:6px 16px;">로그아웃</button>
        </div>

        <!-- [화면 4] 선생님 승인 관리 화면 -->
        <div class="screen" id="screenTeacher">
          <div class="user-info-bar">
            <span>[선생님 모드]</span>
            <span style="cursor:pointer; text-decoration:underline;" onclick="logout()">로그아웃</span>
          </div>
          <div class="teacher-header">
            <div style="font-size:15px;" class="arcade-text">신청 목록</div>
            <button class="btn-clear-all" onclick="clearAllData()">전체지우기</button>
          </div>
          <div id="teacherList" style="width:100%; max-height:280px; overflow-y:auto;"></div>
        </div>

      </div>

      <!-- 하단 PRINT 슬롯 (영수증 출력 애니메이션) -->
      <div class="print-slot-area">
        <div class="print-slot-bar"></div>
        
        <div class="receipt-dispenser-wrapper" id="dispenserWrapper">
          <div class="paper-out" onclick="openReceiptModal()">
            <div>
              <div style="text-align: center; font-weight: bold; margin-bottom: 6px; border-bottom: 1px dashed #000; padding-bottom: 4px; font-size: 13px;">
                LIBRARY PASS
              </div>
              <div style="font-size: 11px; margin: 6px 0; color: #333;">
                ------------------------
              </div>
              <div id="pMiniName" style="margin-bottom: 4px;">성명: -</div>
              <div id="pMiniDate" style="margin-bottom: 4px;">날짜: -</div>
              <div id="pMiniPass" style="margin-bottom: 4px;">패스: -</div>
              <div style="font-size: 11px; margin: 6px 0; color: #333;">
                ------------------------
              </div>
            </div>
            <div style="text-align: center; font-size: 10px; color: #666; border-top: 1px solid #000; padding-top: 4px;">
              [클릭하여 확대보기]
            </div>
          </div>
        </div>

        <div class="print-slot-label">PRINT</div>
      </div>

    </div>
  </div>

  <!-- 영수증 상세 모달 -->
  <div class="modal-overlay" id="receiptModal">
    <div class="receipt-paper">
      <h3>패스 영수증</h3>
      <div class="receipt-row"><span>이름:</span> <strong id="rName">-</strong></div>
      <div class="receipt-row"><span>날짜:</span> <strong id="rDate">-</strong></div>
      <div class="receipt-row"><span>시간:</span> <strong id="rTime">-</strong></div>
      <div class="receipt-row"><span>패스:</span> <strong id="rPass">-</strong></div>
      <div class="receipt-row"><span>사유:</span> <strong id="rReason">-</strong></div>
      <div class="stamp-box">승인완료</div>
      <br>
      <button onclick="closeReceiptModal()" style="width:100%; background:#000; color:#fff; border:none; padding:8px; cursor:pointer;">닫기</button>
    </div>
  </div>

  <script>
    // Firebase 연결 설정 (복사된 설정값 반영됨)
    const firebaseConfig = {
      apiKey: "AIzaSyD-2lCTS1sve-aCZYa8766fm1AeB1VX6-Y",
      authDomain: "library-pass-14d45.firebaseapp.com",
      databaseURL: "https://library-pass-14d45-default-rtdb.firebaseio.com",
      projectId: "library-pass-14d45",
      storageBucket: "library-pass-14d45.firebasestorage.app",
      messagingSenderId: "569655508991",
      appId: "1:569655508991:web:8925dec47ca9f10e1c71ca",
      measurementId: "G-CEDX1XY9KY"
    };
    
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const auth = firebase.auth();

    let currentUser = null;
    let currentAppId = null;
    let passesData = {};
    let statusTimer = null;

    window.onload = () => {
      initDropdowns();
      
      // 구글 로그인 상태 감지 및 'mg' 이메일 조건 분기
      auth.onAuthStateChanged((user) => {
        if (user) {
          currentUser = user;
          const email = user.email.toLowerCase();
          document.getElementById('userEmailTag').innerText = `계정: ${user.email}`;

          // 'mg'로 시작하면 학생 화면, 그 외에는 선생님 화면
          if (email.startsWith('mg')) {
            goToScreen('screenForm');
          } else {
            goToScreen('screenTeacher');
            requestNotificationPermission(); // 선생님 브라우저 알림 권한 요청
          }
        } else {
          currentUser = null;
          goToScreen('screenStart');
        }
      });

      // Firebase 실시간 DB 감지
      database.ref('passes').on('value', (snapshot) => {
        const oldPasses = passesData;
        passesData = snapshot.val() || {};

        // 선생님 모드일 때 새 신청 알림 발송
        if (currentUser && !currentUser.email.toLowerCase().startsWith('mg')) {
          const newKeys = Object.keys(passesData).filter(k => !oldPasses[k]);
          if (newKeys.length > 0 && Object.keys(oldPasses).length > 0) {
            const latest = passesData[newKeys[0]];
            const passesStr = Array.isArray(latest.passes) ? latest.passes.join(', ') : latest.passes;
            sendBrowserNotification(`새 패스 신청: ${latest.name}`, `${latest.date} - ${passesStr}`);
          }
          renderTeacherList();
        }

        if (currentAppId) updateStatusDisplay();
      });
    };

    function loginWithGoogle() {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider).catch(err => alert("로그인 실패: " + err.message));
    }

    function logout() {
      auth.signOut();
      resetForm();
    }

    function initDropdowns() {
      const mSel = document.getElementById('selectMonth');
      const dSel = document.getElementById('selectDay');
      mSel.innerHTML = '<option value="">월</option>';
      dSel.innerHTML = '<option value="">일</option>';
      for (let m = 1; m <= 12; m++) mSel.innerHTML += `<option value="${m}">${m}월</option>`;
      for (let d = 1; d <= 31; d++) dSel.innerHTML += `<option value="${d}">${d}일</option>`;
    }

    function toggleSelect(el) {
      el.classList.toggle('selected');
      const text = el.dataset.val;
      el.innerText = el.classList.contains('selected') ? `[X] ${text}` : `[ ] ${text}`;
    }

    function resetForm() {
      document.getElementById('inputName').value = '';
      document.getElementById('selectMonth').value = '';
      document.getElementById('selectDay').value = '';
      document.getElementById('inputReason').value = '';
      
      document.querySelectorAll('.check-btn').forEach(btn => {
        btn.classList.remove('selected');
        btn.innerText = `[ ] ${btn.dataset.val}`;
      });

      document.getElementById('dispenserWrapper').classList.remove('slide-down');
      if (statusTimer) {
        clearInterval(statusTimer);
        statusTimer = null;
      }
    }

    function goToScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    function submitPassForm() {
      const name = document.getElementById('inputName').value.trim();
      const month = document.getElementById('selectMonth').value;
      const day = document.getElementById('selectDay').value;
      const times = Array.from(document.querySelectorAll('#timeGroup .selected')).map(el => el.dataset.val);
      const passes = Array.from(document.querySelectorAll('#passGroup .selected')).map(el => el.dataset.val);
      const reason = document.getElementById('inputReason').value.trim();

      if (!name) { alert('이름을 입력하세요.'); return; }
      if (!month || !day) { alert('날짜를 선택하세요.'); return; }
      if (times.length === 0) { alert('시간을 선택하세요.'); return; }
      if (passes.length === 0) { alert('패스를 선택하세요.'); return; }

      const newApp = {
        id: 'APP_' + Date.now(),
        code: `LP-${Math.floor(1000 + Math.random() * 9000)}`,
        email: currentUser ? currentUser.email : '비회원',
        name,
        date: `${month}월 ${day}일`,
        times,
        passes,
        reason: reason || '사유 없음',
        status: 'pending'
      };

      currentAppId = newApp.id;
      database.ref('passes/' + newApp.id).set(newApp);

      document.getElementById('codeText').innerText = newApp.code;
      goToScreen('screenStatus');
      updateStatusDisplay();
    }

    function updateStatusDisplay() {
      if (!currentAppId || !passesData[currentAppId]) return;
      const app = passesData[currentAppId];
      const statusText = document.getElementById('statusText');

      if (app.status === 'pending') {
        if (!statusTimer) {
          let dotCount = 1;
          statusText.innerText = '승인확인 중.';
          statusTimer = setInterval(() => {
            dotCount = (dotCount % 3) + 1;
            statusText.innerText = '승인확인 중' + '.'.repeat(dotCount);
          }, 500);
        }
      } else {
        if (statusTimer) {
          clearInterval(statusTimer);
          statusTimer = null;
        }
        if (app.status === 'approved') statusText.innerText = '승인 완료!';
        else if (app.status === 'rejected') statusText.innerText = '승인 거절됨';
      }
    }

    function handleReceiptPrint() {
      if (!currentAppId || !passesData[currentAppId]) return;
      const app = passesData[currentAppId];

      if (app.status !== 'approved') {
        alert('아직 선생님 승인이 완료되지 않았습니다.');
        return;
      }

      document.getElementById('pMiniName').innerText = `성명: ${app.name}`;
      document.getElementById('pMiniDate').innerText = `날짜: ${app.date}`;
      document.getElementById('pMiniPass').innerText = `패스: ${Array.isArray(app.passes) ? app.passes.join(', ') : app.passes}`;

      document.getElementById('dispenserWrapper').classList.add('slide-down');
    }

    function openReceiptModal() {
      if (!currentAppId || !passesData[currentAppId]) return;
      const app = passesData[currentAppId];

      document.getElementById('rName').innerText = app.name;
      document.getElementById('rDate').innerText = app.date;
      document.getElementById('rTime').innerText = Array.isArray(app.times) ? app.times.join(', ') : app.times;
      document.getElementById('rPass').innerText = Array.isArray(app.passes) ? app.passes.join(', ') : app.passes;
      document.getElementById('rReason').innerText = app.reason;
      document.getElementById('receiptModal').classList.add('active');
    }

    function closeReceiptModal() {
      document.getElementById('receiptModal').classList.remove('active');
    }

    function renderTeacherList() {
      const list = Object.values(passesData);
      const container = document.getElementById('teacherList');
      container.innerHTML = '';

      if (list.length === 0) {
        container.innerHTML = '<div style="font-size:14px; color:#fff; text-align:center; padding:20px 0;">신청 데이터가 없습니다.</div>';
        return;
      }

      list.reverse().forEach(app => {
        const card = document.createElement('div');
        card.className = 'admin-card';
        card.innerHTML = `
          <div class="admin-card-title">${app.name} (${app.date})</div>
          <div class="admin-card-info">계정: ${app.email || '-'}</div>
          <div class="admin-card-info">시간: ${Array.isArray(app.times) ? app.times.join(', ') : app.times}</div>
          <div class="admin-card-info">패스: ${Array.isArray(app.passes) ? app.passes.join(', ') : app.passes}</div>
          <div class="admin-card-info">사유: ${app.reason}</div>
          <div class="admin-card-info" style="margin-top:6px;">상태: <strong>${(app.status || '').toUpperCase()}</strong></div>
          <div class="admin-actions">
            <button class="btn-admin-act" onclick="changeStatus('${app.id}', 'approved')">승인</button>
            <button class="btn-admin-act" onclick="changeStatus('${app.id}', 'rejected')">거절</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function changeStatus(id, newStatus) {
      database.ref('passes/' + id + '/status').set(newStatus);
    }

    function clearAllData() {
      if (confirm('정말로 모든 신청 데이터를 삭제하시겠습니까?')) {
        database.ref('passes').remove();
      }
    }

    function requestNotificationPermission() {
      if ("Notification" in window && Notification.permission !== "granted") {
        Notification.requestPermission();
      }
    }

    function sendBrowserNotification(title, body) {
      if ("Notification" in window && Notification.permission === "granted") {
        new Notification(title, { body });
      }
    }
  </script>
</body>
</html>
